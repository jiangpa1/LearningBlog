name: Build and push Docker image

# 为什么用 Actions 而不是本地 docker push：
#   1. 不需要个人访问令牌（PAT）—— 用 GitHub 自动注入的 GITHUB_TOKEN，权限只给 packages: write
#   2. 不占本机带宽（省掉上传 ~146MB）
#   3. 镜像由仓库源码构建，**可复现**：任何人都能用同一个 commit 重建出同一个镜像
#   4. CI 环境里根本没有 application-local.yml（它被 gitignore），所以构建出的镜像天然不含任何口令
on:
  push:
    branches: [main]
    # 只在会影响镜像产物的文件变化时才构建；改文档不触发（省 Actions 额度）
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  # 也允许在 Actions 页面手动点一下触发
  workflow_dispatch:

env:
  # GHCR 要求镜像路径全小写；github.repository_owner 就是 jiangpa1
  IMAGE: ghcr.io/${{ github.repository_owner }}/learning-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write        # ★ 推镜像必须显式声明，否则 403

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:1.0
            ${{ env.IMAGE }}:latest
          # 用 GitHub Actions 的缓存存 Docker 层：
          # 首次构建仍要下全部 Maven 依赖（约 10–15 分钟），之后命中缓存会快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
